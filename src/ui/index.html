<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FieldTrip · Flue on Cloudflare Workers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!--
  FieldTrip chat UI: one self-contained file, no build step, no dependencies.
  Served by src/app.ts at GET /. It talks to the agent over Flue's HTTP protocol:
    POST /agents/field-trip/:id                              -> 202 { offset, submissionId }
    GET  /agents/field-trip/:id?view=updates&offset=…&live=sse -> live chunks (streaming)
    GET  /agents/field-trip/:id?view=history                 -> snapshot (fallback polling)
  Override the mount path with ?agent=/agents/other-path
-->
<style>
  :root {
    --orange: #ff4801; --orange-hover: #ff7038;
    --text: #521000;
    --muted: oklch(28.99% 0.1003 35.6 / 0.78);
    --subtle: oklch(28.99% 0.1003 35.6 / 0.56);
    --bg-page: #f5f1eb; --bg-100: #fffbf5; --bg-200: #fffdfb; --bg-300: #fef7ed;
    --border: #ebd5c1; --border-light: oklch(88.58% 0.0364 64.6 / 0.5);
    --success: #16a34a; --error: #dc2626; --ai: #9616ff; --info: #2563eb;
    --dark: #2a1a0e; --dark-border: #3d2a18; --dark-text: #f5ede0;
    --shadow-card: 0 1px 3px oklch(28.99% 0.1003 35.6 / 0.04), 0 4px 12px oklch(28.99% 0.1003 35.6 / 0.02);
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
    --ease-button: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.6 var(--sans); color: var(--text); background: var(--bg-page);
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle, var(--border) 0.75px, transparent 0.75px);
    background-size: 12px 12px;
  }
  a { color: var(--orange); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header {
    max-width: 1240px; margin: 0 auto; padding: 20px 24px 12px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; background: var(--orange);
    display: grid; place-items: center; color: var(--bg-200); font-weight: 700;
  }
  h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.025em; margin: 0; line-height: 1.2; }
  .tagline { font-size: 13px; color: var(--muted); }
  .pill {
    font: 12px var(--mono); color: var(--muted); background: var(--bg-200);
    border: 1px solid var(--border); border-radius: 9999px; padding: 6px 12px;
  }
  .pill b { color: var(--text); font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0.625rem 1.25rem; border-radius: 9999px; font: 500 0.9375rem var(--sans);
    border: 1px solid var(--border); background: var(--bg-200); color: var(--text); cursor: pointer;
    transition: all 0.16s var(--ease-button);
  }
  .btn:hover { border-style: dashed; border-color: var(--orange); }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: var(--bg-200); }
  .btn.primary:hover { background: var(--orange-hover); border-color: var(--orange-hover); border-style: solid; }
  .btn:disabled { opacity: 0.55; pointer-events: none; }
  .btn.small { padding: 6px 12px; font-size: 13px; }

  .layout {
    max-width: 1240px; margin: 0 auto; padding: 0 24px 24px;
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px;
    height: calc(100vh - 84px); min-height: 520px;
  }
  .card {
    background: var(--bg-200); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-card);
  }
  .chat { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #transcript { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

  .msg { max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble {
    background: var(--bg-300); border: 1px solid var(--border); border-radius: 16px 16px 4px 16px;
    padding: 10px 14px; white-space: pre-wrap;
  }
  .msg.agent { align-self: flex-start; width: 88%; }
  .who { font: 500 11px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--subtle); margin-bottom: 4px; }
  .msg.agent .who { color: var(--ai); }
  .msg.user .who { text-align: right; }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 10px; }
  .prose h4 { font-size: 16px; font-weight: 500; margin: 14px 0 6px; letter-spacing: -0.01em; }
  .prose ul, .prose ol { margin: 0 0 10px; padding-left: 22px; }
  .prose code { font: 0.875em var(--mono); color: var(--ai); background: rgba(150, 22, 255, 0.08); border-radius: 4px; padding: 1px 5px; }
  .prose pre { background: var(--dark); color: var(--dark-text); border: 1px solid var(--dark-border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .prose pre code { background: none; color: inherit; padding: 0; }
  .prose table { border-collapse: collapse; margin: 0 0 10px; font-size: 14px; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .prose th { background: var(--bg-300); font-weight: 500; }
  .prose hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  .cursor::after { content: '▍'; color: var(--orange); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  details.tool, details.reasoning, .data-part {
    margin: 6px 0; border: 1px solid rgba(150, 22, 255, 0.25); border-radius: 12px;
    background: rgba(150, 22, 255, 0.05); font: 13px var(--mono);
  }
  details.reasoning { border-color: var(--border-light); background: var(--bg-100); color: var(--muted); }
  details > summary { cursor: pointer; padding: 6px 12px; list-style: none; display: flex; gap: 8px; align-items: center; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '▸'; color: var(--subtle); transition: transform 0.15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  .tool-name { color: var(--ai); font-weight: 500; }
  .tool-meta { color: var(--subtle); margin-left: auto; }
  .tool.error { border-color: rgba(220, 38, 38, 0.3); background: rgba(220, 38, 38, 0.06); }
  .tool.error .tool-name { color: var(--error); }
  .tool-body { padding: 0 12px 10px; }
  .tool-body .label { color: var(--subtle); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }
  .tool-body pre, .data-part pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; background: var(--dark); color: var(--dark-text); border-radius: 8px; padding: 8px 10px; max-height: 260px; overflow: auto; }
  .reasoning .tool-body { white-space: pre-wrap; font-family: var(--sans); font-size: 13px; }
  .data-part { padding: 6px 12px 10px; border-color: rgba(37, 99, 235, 0.25); background: rgba(37, 99, 235, 0.05); }
  .data-part .tool-name { color: var(--info); }
  .spinner { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(150, 22, 255, 0.25); border-top-color: var(--ai); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .signal { align-self: center; font: 12px var(--mono); color: var(--subtle); text-align: center; max-width: 90%; }
  .notice {
    border: 1px solid var(--border); border-left: 4px solid var(--error); background: rgba(220, 38, 38, 0.06);
    border-radius: 12px; padding: 10px 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .notice.info { border-left-color: var(--info); background: rgba(37, 99, 235, 0.06); }
  .thinking { display: flex; gap: 8px; align-items: center; font: 13px var(--mono); color: var(--subtle); }

  .welcome { margin: auto; text-align: center; max-width: 460px; color: var(--muted); }
  .welcome h2 { font-size: 24px; font-weight: 500; letter-spacing: -0.025em; color: var(--text); margin: 0 0 8px; }

  form#composer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border-light); background: var(--bg-100); align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: 0.9375rem/1.5 var(--mono); color: var(--text); background: var(--bg-200);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; outline: none; max-height: 180px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder { color: var(--subtle); }
  textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 72, 1, 0.2); }

  aside { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-height: 0; }
  aside .card { padding: 20px; }
  aside h3 { font: 500 11px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--subtle); margin: 0 0 12px; }
  .examples { display: flex; flex-direction: column; gap: 8px; }
  .chip {
    display: flex; gap: 10px; align-items: baseline; text-align: left; width: 100%;
    font: 13px var(--mono); color: var(--muted); background: var(--bg-200);
    border: 1px solid var(--border); border-radius: 9999px; padding: 7px 14px; cursor: pointer;
    transition: all 0.16s var(--ease-button);
  }
  .chip:hover { border-style: dashed; border-color: var(--orange); color: var(--text); }
  .chip:active { transform: translateY(1px) scale(0.98); }
  .chip .cp { color: var(--orange); font-weight: 500; }
  .status { font: 12px var(--mono); color: var(--muted); display: grid; gap: 6px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--subtle); margin-right: 6px; }
  .status .dot.live { background: var(--success); }
  .status .dot.poll { background: #eab308; }
  .status .dot.busy { background: var(--ai); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .chat { height: 75vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">F</div>
    <div>
      <h1>FieldTrip</h1>
      <div class="tagline">Team-offsite planner · Flue on Cloudflare Workers + Durable Objects</div>
    </div>
  </div>
  <span class="pill">conversation <b id="conv-id"></b></span>
  <button class="btn small" id="new-conv" type="button">New conversation</button>
</header>

<main class="layout">
  <section class="card chat">
    <div id="transcript" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" rows="2" placeholder="Describe your offsite… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn primary" id="send" type="submit">Send</button>
    </form>
  </section>

  <aside>
    <div class="card">
      <h3>Try it · by checkpoint</h3>
      <div class="examples" id="examples"></div>
    </div>

    <div class="card">
      <h3>Build it yourself</h3>
      <div class="status">
        <div>Clone the workshop repo and build this agent checkpoint by checkpoint:</div>
        <div><a href="https://github.com/omkarkhair/field-trip-agent" target="_blank" rel="noopener">github.com/omkarkhair/field-trip-agent →</a></div>
      </div>
    </div>

    <div class="card">
      <h3>Connection</h3>
      <div class="status">
        <div><span class="dot" id="mode-dot"></span><span id="mode">idle</span></div>
        <div>agent <b id="agent-path"></b></div>
        <div><a id="history-link" target="_blank" rel="noopener">raw history JSON →</a></div>
      </div>
    </div>
  </aside>
</main>

<script>
(() => {
  const AGENT_PATH = new URLSearchParams(location.search).get('agent') || '/agents/field-trip';
  const params = () => new URLSearchParams(location.search); // ?id=<conversation> (bookmarkable), ?agent=<mount path>
  const POLL_MS = 1500;
  const TIMEOUT_MS = 180000;
  const $ = (s) => document.querySelector(s);

  // Dates one week out, so the weather example (cp3) stays inside the 16-day forecast window.
  const iso = (d) => d.toISOString().slice(0, 10);
  const start = new Date(Date.now() + 7 * 864e5), end = new Date(Date.now() + 8 * 864e5);
  const EXAMPLES = [
    ['cp1', 'Hi, who are you?'],
    ['cp2', `We're planning an offsite in Lisbon from ${iso(start)} to ${iso(end)} for 14 people, budget around 400 EUR per person. We like food, history and something outdoorsy.`],
    ['cp2', "What's my headcount, city and budget? One line."],
    ['cp3', "What's the weather forecast for our trip dates?"],
    ['cp4', 'Suggest 3 venues near the city centre that fit our interests.'],
    ['cp5', 'Write the itinerary to itinerary.md and show it to me.'],
  ];

  let convId = params().get('id') || newConversationId(true);
  let messages = [];   // snapshot-shaped: { id, role, purpose, display, parts[], settlement? }
  let notices = [];    // local-only messages (errors, hints), cleared on the next send
  let lastPos = null;  // last applied stream position, for dedupe
  let busy = false;
  const openKeys = new Set(); // <details> the user expanded, preserved across re-renders

  // New ids go into the URL, so every conversation has a link you can save or open in another tab.
  function newConversationId(replace) {
    const id = 'web-' + Math.random().toString(36).slice(2, 8);
    const p = params(); p.set('id', id);
    history[replace ? 'replaceState' : 'pushState'](null, '', `?${p}`);
    return id;
  }
  const convUrl = () => `${AGENT_PATH}/${encodeURIComponent(convId)}`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function setMode(kind, text) {
    $('#mode').textContent = text;
    $('#mode-dot').className = 'dot ' + (kind || '');
  }

  // ---------- rendering ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const inline = (s) => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  function table(rows) {
    const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(esc(c.trim())));
    const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r));
    if (!body.length) return '';
    const [head, ...rest] = body;
    return '<table><thead><tr>' + cells(head).map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
      rest.map((r) => '<tr>' + cells(r).map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
  }

  // Deliberately small markdown renderer: HTML is escaped first, then a few constructs are added.
  function md(src) {
    const lines = String(src).split('\n');
    const out = [];
    const isList = (l) => /^\s*([-*]|\d+\.)\s+/.test(l);
    const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
      }
      if (isRow(line)) { const rows = []; while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]); out.push(table(rows)); continue; }
      const h = line.match(/^#{1,6}\s+(.*)$/);
      if (h) { out.push(`<h4>${inline(esc(h[1]))}</h4>`); i++; continue; }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (isList(line)) {
        const ordered = /^\s*\d+\./.test(line), items = [];
        while (i < lines.length && isList(lines[i]) && /^\s*\d+\./.test(lines[i]) === ordered) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>` + items.map((x) => `<li>${inline(esc(x))}</li>`).join('') + `</${tag}>`); continue;
      }
      if (!line.trim()) { i++; continue; }
      const para = [];
      do { para.push(lines[i++]); } while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|\s*(---+|\*\*\*+)\s*$)/.test(lines[i]) && !isList(lines[i]) && !isRow(lines[i]));
      out.push('<p>' + inline(esc(para.join('\n'))).replace(/\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  const json = (v) => esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2));
  const openAttr = (key) => (openKeys.has(key) ? ' open' : '');

  function renderPart(p, msgId, idx, streaming) {
    if (p.type === 'text') return `<div class="prose${streaming && p.state === 'streaming' ? ' cursor' : ''}">${md(p.text)}</div>`;
    if (p.type === 'reasoning') {
      const key = `r:${msgId}:${idx}`;
      return `<details class="reasoning" data-key="${key}"${openAttr(key)}><summary>reasoning</summary><div class="tool-body">${esc(p.text)}</div></details>`;
    }
    if (p.type === 'dynamic-tool') {
      const key = `t:${p.toolCallId}`;
      const err = p.state === 'output-error';
      const pending = p.state === 'input-available';
      const meta = pending ? '<span class="spinner"></span>' : `${err ? 'error' : 'ok'}${p.durationMs != null ? ` · ${p.durationMs} ms` : ''}`;
      const result = pending ? '' : `<div class="label">${err ? 'error' : 'output'}</div><pre>${err ? esc(p.errorText) : json(p.output)}</pre>`;
      return `<details class="tool${err ? ' error' : ''}" data-key="${key}"${openAttr(key)}><summary>⚙ <span class="tool-name">${esc(p.toolName)}</span><span class="tool-meta">${meta}</span></summary>` +
        `<div class="tool-body"><div class="label">input</div><pre>${json(p.input)}</pre>${result}</div></details>`;
    }
    if (p.type && p.type.startsWith('data-')) {
      return `<div class="data-part"><span class="tool-name">◆ ${esc(p.type)}</span><pre>${json(p.data)}</pre></div>`;
    }
    return '';
  }

  function renderMessage(m) {
    if (m.display === 'hidden') return '';
    const text = (m.parts || []).filter((p) => p.type === 'text').map((p) => p.text).join('');
    if (m.role === 'user') return `<div class="msg user"><div class="who">you</div><div class="bubble">${esc(text)}</div></div>`;
    if (m.role === 'system') {
      if (m.settlement) return `<div class="notice">Submission ${esc(m.settlement.outcome)}. ${esc(text)}</div>`;
      return text.trim() ? `<div class="signal">[${esc(m.purpose || 'system')}] ${esc(text.trim())}</div>` : '';
    }
    // data-<name> parts: show only the latest write per name (writes update one part).
    const lastData = new Map();
    (m.parts || []).forEach((p, i) => { if (p.type && p.type.startsWith('data-')) lastData.set(p.type, i); });
    const parts = (m.parts || [])
      .map((p, i) => (p.type && p.type.startsWith('data-') && lastData.get(p.type) !== i ? '' : renderPart(p, m.id, i, busy)))
      .join('');
    return `<div class="msg agent"><div class="who">fieldtrip</div>${parts || '<div class="thinking"><span class="spinner"></span>working…</div>'}</div>`;
  }

  function render() {
    const t = $('#transcript');
    const nearBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 80;
    const body = messages.map(renderMessage).join('') + notices.map((n) => `<div class="notice ${n.kind || ''}">${n.html}</div>`).join('');
    const lastIsUser = messages.length && messages[messages.length - 1].role === 'user';
    const waiting = busy && lastIsUser ? '<div class="thinking"><span class="spinner"></span>waiting for FieldTrip…</div>' : '';
    t.innerHTML = body || waiting ? body + waiting :
      `<div class="welcome"><h2>Plan a team offsite</h2><p>Tell FieldTrip the city, dates, headcount, budget and interests, or pick an example on the right. Each conversation id is its own Durable Object.</p></div>`;
    if (nearBottom || busy) t.scrollTop = t.scrollHeight;
  }

  // ---------- stream chunk reducer (mirrors the snapshot shape) ----------
  const clone = (m) => JSON.parse(JSON.stringify(m));
  const find = (id) => messages.find((m) => m.id === id);
  function ensureAssistant(id, submissionId) {
    let m = find(id);
    if (!m) { m = { id, role: 'assistant', purpose: 'assistant', display: 'visible', submissionId, parts: [] }; messages.push(m); }
    return m;
  }
  function closeStreaming(m) { for (const p of m.parts) if (p.state === 'streaming') p.state = 'done'; }
  function findTool(toolCallId) {
    for (const m of messages) for (const p of m.parts || []) if (p.type === 'dynamic-tool' && p.toolCallId === toolCallId) return p;
  }

  function apply(c) {
    const pos = c.position;
    if (pos && lastPos && (pos.batch < lastPos.batch || (pos.batch === lastPos.batch && pos.index <= lastPos.index))) return; // redelivered
    if (pos) lastPos = pos;
    switch (c.type) {
      case 'conversation-reset': messages = c.snapshot.messages.map(clone); break;
      case 'message-appended':
        // A new conversation's stream replays the user's own message; drop the optimistic copy.
        if (c.message.role === 'user') messages = messages.filter((m) => !m.id.startsWith('local-'));
        if (!find(c.message.id)) messages.push(clone(c.message));
        break;
      case 'message-started': ensureAssistant(c.messageId, c.submissionId); break;
      case 'message-delta': {
        const m = ensureAssistant(c.messageId);
        const last = m.parts[m.parts.length - 1];
        if (last && last.type === c.kind && last.state === 'streaming') last.text += c.delta;
        else { closeStreaming(m); m.parts.push({ type: c.kind, text: c.delta, state: 'streaming' }); }
        break;
      }
      case 'tool-input': {
        const m = ensureAssistant(c.messageId);
        closeStreaming(m);
        if (!findTool(c.toolCallId)) m.parts.push({ type: 'dynamic-tool', toolName: c.toolName, toolCallId: c.toolCallId, state: 'input-available', input: c.input });
        break;
      }
      case 'tool-output': { const p = findTool(c.toolCallId); if (p) Object.assign(p, { state: 'output-available', output: c.output, durationMs: c.durationMs }); break; }
      case 'tool-output-error': { const p = findTool(c.toolCallId); if (p) Object.assign(p, { state: 'output-error', errorText: c.errorText, durationMs: c.durationMs }); break; }
      case 'data-part': ensureAssistant(c.messageId).parts.push({ type: `data-${c.name}`, data: c.data }); break;
      case 'message-metadata': { const m = find(c.messageId); if (m) m.metadata = { ...(m.metadata || {}), ...c.metadata }; break; }
      case 'message-completed': { const m = find(c.messageId); if (m) closeStreaming(m); break; }
    }
  }
  function settlementIn(c, submissionId) {
    if (c.type === 'submission-settled' && c.submissionId === submissionId) return c;
    if (c.type === 'conversation-reset') return c.snapshot.settlements.find((s) => s.submissionId === submissionId);
  }

  // ---------- transport ----------
  async function loadHistory() {
    const res = await fetch(`${convUrl()}?view=history`);
    if (res.status === 404) { messages = []; render(); return null; } // conversation not created yet (or no agent mounted)
    if (!res.ok) throw new Error(`GET history → ${res.status} ${await res.text()}`);
    const snap = await res.json();
    messages = snap.messages.map(clone);
    render();
    return snap;
  }

  // Preferred: live SSE stream from the admission offset. Fallback: poll the snapshot.
  function follow(offset, submissionId) {
    if (!('EventSource' in window)) return poll(submissionId);
    return new Promise((resolve) => {
      let finished = false;
      lastPos = null;
      setMode('live', 'streaming (SSE)');
      const es = new EventSource(`${convUrl()}?view=updates&offset=${encodeURIComponent(offset)}&live=sse`);
      es.addEventListener('data', (e) => {
        if (finished) return;
        let chunks;
        try { chunks = JSON.parse(e.data); } catch { return; }
        for (const c of chunks) {
          apply(c);
          const s = settlementIn(c, submissionId);
          if (s) { finished = true; es.close(); render(); resolve(s); return; }
        }
        render();
      });
      es.onerror = () => {
        if (finished) return;
        finished = true;
        es.close();
        poll(submissionId).then(resolve);
      };
    });
  }

  async function poll(submissionId) {
    setMode('poll', 'polling history');
    const started = Date.now();
    while (Date.now() - started < TIMEOUT_MS) {
      await sleep(POLL_MS);
      try {
        const snap = await loadHistory();
        const s = snap && snap.settlements.find((x) => x.submissionId === submissionId);
        if (s) return s;
      } catch { /* transient; keep polling */ }
    }
    return { outcome: 'timeout' };
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true; notices = [];
    $('#send').disabled = true;
    setMode('busy', 'sending…');
    messages.push({ id: `local-${Date.now()}`, role: 'user', display: 'visible', parts: [{ type: 'text', text }] });
    render();
    try {
      let res;
      try {
        res = await fetch(convUrl(), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: 'user', body: text }) });
      } catch {
        throw new Error('Could not reach the Worker. Is `npm run dev` running?');
      }
      if (res.status === 404) {
        notices.push({ kind: 'info', html: `No agent is mounted at <code>${esc(AGENT_PATH)}</code> yet. That's <b>checkpoint 1</b>: add <code>src/agents/field-trip.ts</code>, mount it in <code>src/app.ts</code>, and add the Durable Object migration.` });
        messages.pop();
        return;
      }
      if (res.status !== 202) throw new Error(`Expected 202, got ${res.status}: ${await res.text()}`);
      const { offset, submissionId } = await res.json();
      const settled = await follow(offset, submissionId);
      await loadHistory().catch(() => {}); // re-sync to the canonical snapshot
      if (settled.outcome === 'timeout') notices.push({ html: 'Timed out waiting for the reply. The work is still accepted; reload to see it.' });
      else if (settled.outcome !== 'completed') notices.push({ html: `Submission ${esc(settled.outcome)}: ${esc(JSON.stringify(settled.error ?? ''))}` });
    } catch (err) {
      notices.push({ html: esc(err.message) });
    } finally {
      busy = false;
      $('#send').disabled = false;
      setMode('', 'idle');
      render();
    }
  }

  // ---------- wiring ----------
  function showConversation() {
    $('#conv-id').textContent = convId;
    $('#history-link').href = `${convUrl()}?view=history`;
    notices = []; messages = [];
    render();
    loadHistory().catch((e) => { notices.push({ html: esc(e.message) }); render(); });
  }

  $('#agent-path').textContent = AGENT_PATH;
  for (const [cp, text] of EXAMPLES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.innerHTML = `<span class="cp">${cp}</span><span>${esc(text.length > 70 ? text.slice(0, 68) + '…' : text)}</span>`;
    b.title = text;
    b.onclick = () => { const i = $('#input'); i.value = text; i.focus(); };
    $('#examples').appendChild(b);
  }
  $('#composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const i = $('#input'), text = i.value;
    i.value = '';
    send(text);
  });
  $('#input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#composer').requestSubmit(); }
  });
  $('#new-conv').onclick = () => { if (busy) return; convId = newConversationId(false); showConversation(); };
  addEventListener('popstate', () => { if (busy) return; convId = params().get('id') || newConversationId(true); showConversation(); });
  $('#transcript').addEventListener('toggle', (e) => {
    const key = e.target.dataset && e.target.dataset.key;
    if (key) e.target.open ? openKeys.add(key) : openKeys.delete(key);
  }, true);

  setMode('', 'idle');
  showConversation();
})();
</script>
</body>
</html>
